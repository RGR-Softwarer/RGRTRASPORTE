<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="card-header">
      <h2>Esqueci minha senha</h2>
      <p>Digite seu email para receber instruções de recuperação</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Digite seu email"
          class="form-control"
          [class.error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
        />
        <div class="error-message" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="forgotPasswordForm.invalid || isLoading"
        >
          <span *ngIf="isLoading">Enviando...</span>
          <span *ngIf="!isLoading">Enviar instruções</span>
        </button>
        
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="voltarParaLogin()"
          [disabled]="isLoading"
        >
          Voltar para login
        </button>
      </div>
    </form>
  </div>
</div>
