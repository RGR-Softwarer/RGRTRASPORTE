<div class="grid-container">
  <!-- Botões de ação -->
  <div class="grid-actions">
    <div class="grid-actions-left">
      <app-button *ngIf="valorConfiguracao.adicionar" 
                  [variant]="'primary'"
                  (click)="adicionar()"
                  [title]="'Adicionar novo registro'">
        <i class="fas fa-plus"></i>
        Adicionar
      </app-button>
    </div>
    <div class="grid-actions-right">
      <app-button (click)="exportToExcel()"
                  [title]="'Exportar dados para Excel'">
        <i class="fas fa-download"></i>
        Exportar
      </app-button>
      <app-button (click)="showColumnSelector()"
                  [title]="'Configurar colunas visíveis'">
        <i class="fas fa-cog"></i>
        Colunas
      </app-button>
      <app-button (click)="reset()"
                  [title]="'Limpar filtros e ordenação'">
        <i class="fas fa-broom"></i>
        Limpar
      </app-button>
    </div>
  </div>

  <!-- Modal de Seleção de Colunas -->
  <app-modal
    [show]="isColumnSelectorVisible"
    title="Configurar Colunas"
    (cancel)="handleColumnSelectorCancel()"
    (confirm)="handleColumnSelectorOk()"
    confirmText="Aplicar"
    cancelText="Cancelar"
  >
    <div class="column-selector-content">
      <label class="select-all-checkbox">
        <input type="checkbox" 
               [(ngModel)]="allChecked"
               [indeterminate]="indeterminado"
               (ngModelChange)="onAllChecked($event)">
        Selecionar Todas
      </label>
      <hr style="margin: 8px 0;">
      
      <!-- Lista de checkboxes das colunas -->
      <div class="column-list" style="max-height: 300px; overflow-y: auto;">
        <div *ngFor="let option of columnSelections" class="column-item">
          <label>
            <input type="checkbox"
                   [(ngModel)]="option.checked"
                   (ngModelChange)="onItemCheckedChange()">
            {{ option.label }}
          </label>
        </div>
      </div>
    </div>
  </app-modal>

  <!-- Área de Filtros -->
  <div class="filters-section">
    <div class="filters-header" (click)="painelFiltrosExpandido = !painelFiltrosExpandido">
      <span>Filtros</span>
      <i class="fas" [class.fa-chevron-up]="painelFiltrosExpandido" [class.fa-chevron-down]="!painelFiltrosExpandido"></i>
    </div>
    
    <div class="filters-content" *ngIf="painelFiltrosExpandido">
      <div class="row g-3">
        <ng-container *ngFor="let filter of filterColumns">
          <div *ngIf="filter.visible" 
               class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 filter-column">
            
            <!-- Filtro para campos Boolean -->
            <app-select-field *ngIf="filter.type === 'bool'"
                             [id]="'filter-' + filter.key"
                             [label]="filter.label"
                             [placeholder]="'Todos'"
                             [options]="[
                               { value: 'true', label: 'Sim' },
                               { value: 'false', label: 'Não' }
                             ]"
                             [(ngModel)]="searchInputs[filter.key]"
                             (valueChange)="onFilterChange()">
            </app-select-field>

            <!-- Filtro para campos Enum -->
            <app-select-field *ngIf="filter.type === 'enum'"
                             [id]="'filter-' + filter.key"
                             [label]="filter.label"
                             [placeholder]="'Todos'"
                             [options]="filter.options || []"
                             [(ngModel)]="searchInputs[filter.key]"
                             (valueChange)="onFilterChange()">
            </app-select-field>

            <!-- Filtro para campos de Texto -->
            <app-input-field *ngIf="filter.type === 'texto'"
                            [id]="'filter-' + filter.key"
                            [label]="filter.label"
                            [type]="'text'"
                            [placeholder]="filter.placeholder || 'Filtrar por ' + filter.label.toLowerCase()"
                            [(ngModel)]="searchInputs[filter.key]"
                            (valueChange)="onFilterChange()">
            </app-input-field>

            <!-- Filtro para campos de Número -->
            <app-input-field *ngIf="filter.type === 'numero'"
                            [id]="'filter-' + filter.key"
                            [label]="filter.label"
                            [type]="'number'"
                            [placeholder]="filter.placeholder || 'Filtrar por ' + filter.label.toLowerCase()"
                            [(ngModel)]="searchInputs[filter.key]"
                            (valueChange)="onFilterChange()">
            </app-input-field>

            <!-- Filtro para campos de Data -->
            <app-input-field *ngIf="filter.type === 'data'"
                            [id]="'filter-' + filter.key"
                            [label]="filter.label"
                            [type]="'date'"
                            [(ngModel)]="searchInputs[filter.key]"
                            (valueChange)="onFilterChange()">
            </app-input-field>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Tabela -->
  <div class="table-container">
    <div class="table-responsive">
      <table class="table table-striped table-hover" [class.table-bordered]="valorConfiguracao.comBorda">
        <thead *ngIf="valorConfiguracao.cabecalho">
          <tr>
            <ng-container *ngFor="let col of gridColumns">
              <th *ngIf="col.visible" 
                  class="sortable-header text-center"
                  style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;"
                  (click)="onSortChange(col.key, sortField === col.key && sortOrder === 'ascend' ? 'descend' : 'ascend')">
                <span [title]="col.label">{{ col.label }}</span>
                <i *ngIf="sortField === col.key" 
                   class="fas" 
                   [class.fa-sort-up]="sortOrder === 'ascend'"
                   [class.fa-sort-down]="sortOrder === 'descend'"></i>
                <i *ngIf="sortField !== col.key" class="fas fa-sort text-muted"></i>
              </th>
            </ng-container>
            <th *ngIf="acoes && acoes.length > 0" 
                class="actions-header text-center"
                style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
              Ações
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of dadosFiltradosLocalmente.slice((paginaAtual - 1) * tamanhoPagina, paginaAtual * tamanhoPagina); trackBy: trackByFn">
            <ng-container *ngFor="let col of gridColumns">
              <td *ngIf="col.visible" class="data-cell">
                <span [title]="formatCellValue(data[col.key], col.key)">
                  {{ formatCellValue(data[col.key], col.key) }}
                </span>
              </td>
            </ng-container>
            <td *ngIf="acoes && acoes.length > 0" class="actions-cell">
              <ng-container *ngFor="let acao of acoes; let i = index">
                <button 
                  class="btn btn-link btn-sm action-button"
                  (click)="acao.acao(data)"
                  [title]="acao.label"
                >
                  {{ acao.label }}
                </button>
                <span *ngIf="i < acoes.length - 1" class="mx-1">|</span>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginação -->
    <div *ngIf="valorConfiguracao.paginacao" class="pagination-container">
      <div class="d-flex justify-content-between align-items-center">
        <div class="pagination-info">
          {{ getPaginationInfo() }}
        </div>
        <nav aria-label="Navegação de páginas">
          <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="paginaAtual === 1">
              <a class="page-link" (click)="onPageIndexChange(paginaAtual - 1)" style="cursor: pointer;">Anterior</a>
            </li>
            
            <li *ngFor="let page of getPageNumbers()" 
                class="page-item" 
                [class.active]="page === paginaAtual">
              <a class="page-link" (click)="onPageIndexChange(page)" style="cursor: pointer;">{{ page }}</a>
            </li>
            
            <li class="page-item" [class.disabled]="paginaAtual >= getTotalPages()">
              <a class="page-link" (click)="onPageIndexChange(paginaAtual + 1)" style="cursor: pointer;">Próximo</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
