<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080">
  <div *ngFor="let notification of notifications" class="toast show align-items-center text-bg-{{notification.type}} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        <strong *ngIf="notification.title">{{ notification.title }}</strong>
        <div *ngIf="notification.message">{{ notification.message }}</div>
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Fechar" (click)="removeNotification(notification.id)"></button>
    </div>
  </div>
</div>
