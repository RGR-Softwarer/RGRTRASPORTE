<form [formGroup]="formGroup" (ngSubmit)="formGroup.valid && formGroup.submit()" novalidate>
  <ng-content></ng-content>
  <div class="form-actions">
    <button app-button type="submit" [disabled]="loading || !formGroup.valid">
      <span *ngIf="loading">Salvando...</span>
      <span *ngIf="!loading">{{ submitLabel }}</span>
    </button>
  </div>
</form>
