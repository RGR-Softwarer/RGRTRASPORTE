<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <h2>Login</h2>
      <p>Faça login para acessar sua conta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Digite seu email"
          class="form-control"
          [class.error]="hasFieldError('email')"
          #emailInput
        />
        <div class="error-message" *ngIf="hasFieldError('email')">
          {{ getEmailErrorMessage() }}
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input 
          type="password" 
          id="senha" 
          formControlName="senha" 
          placeholder="Digite sua senha"
          class="form-control"
          [class.error]="hasFieldError('senha')"
        />
        <div class="error-message" *ngIf="hasFieldError('senha')">
          {{ getSenhaErrorMessage() }}
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-wrapper">
          <input type="checkbox" formControlName="lembrar" class="checkbox-input">
          <span class="checkbox-custom"></span>
          <span class="checkbox-label">Lembrar-me</span>
        </label>
        <a routerLink="/auth/forgot-password" class="forgot-link">Esqueceu a senha?</a>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="loading || loginForm.invalid"
        >
          <span *ngIf="loading">Entrando...</span>
          <span *ngIf="!loading">Entrar</span>
        </button>
        
        <div class="divider">
          <span>ou</span>
        </div>
        
        <a routerLink="/auth/register" class="btn btn-secondary">
          Criar nova conta
        </a>
    </div>
    </form>
  </div>
</div>
