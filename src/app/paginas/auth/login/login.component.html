<form nz-form [formGroup]="loginForm" class="login-form" (ngSubmit)="onSubmit()">
  <nz-form-item>
    <nz-form-control nzErrorTip="Digite seu email!">
      <nz-input-group nzPrefixIcon="user">
        <input type="text" nz-input formControlName="email" placeholder="Email" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="{{ getSenhaErrorMessage() }}">
      <nz-input-group nzPrefixIcon="lock">
        <input type="password" nz-input formControlName="senha" placeholder="Senha" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <div nz-row class="login-form-margin">
    <div nz-col [nzSpan]="12">
      <label nz-checkbox formControlName="lembrar">
        <span>Lembrar-me</span>
      </label>
    </div>
    <div nz-col [nzSpan]="12">
      <a class="login-form-forgot">Esqueceu a senha</a>
    </div>
  </div>
  <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Entrar</button>
  Ou
  <a>Registrar agora!</a>
</form>
