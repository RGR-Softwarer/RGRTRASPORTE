<div class="dashboard-container">
  <div class="dashboard-content">
    <!-- Header do Dashboard Simplificado -->
    <div class="dashboard-header">
      <div class="welcome-section">
        <h1 class="dashboard-title">
          <i class="fas fa-home me-3"></i>
          Bem-vindo, {{ userContext?.username || 'Usuário' }}!
        </h1>
        <p class="user-email" *ngIf="userContext?.email">
          <i class="fas fa-envelope me-2"></i>
          {{ userContext?.email }}
        </p>
      </div>
    </div>

    <!-- Card de Boas-vindas -->
    <div class="welcome-card">
      <div class="card">
        <div class="card-body text-center">
          <div class="welcome-icon">
            <i class="fas fa-user-circle fa-4x text-primary"></i>
          </div>
          <h3 class="mt-3">Olá, {{ userContext?.username || 'Usuário' }}!</h3>
          <p class="text-muted">
            Seja bem-vindo ao sistema RGR. 
            <br>
            Utilize o menu lateral para navegar pelas funcionalidades.
          </p>
          <div class="user-info mt-3" *ngIf="userContext?.email">
            <p class="mb-0">
              <strong>Email:</strong> {{ userContext?.email }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
